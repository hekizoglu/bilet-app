name: CI - Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      # Integration testleri için boş bir SQLite şeması kur (önceden DATABASE_URL
      # eksik olduğundan tüm integration testleri PrismaClientInitializationError ile çöküyordu)
      - name: Prepare Test Database Schema
        working-directory: backend
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Run Unit Tests
        working-directory: backend
        run: npx jest --testPathPattern='__tests__/unit' --coverage --ci
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: Run Integration Tests
        working-directory: backend
        run: npx jest --testPathPattern='__tests__/integration' --ci
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
          DATABASE_URL: file:./prisma/ci.db

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint src
        # Error seviyesindeki sorunlar build'i engeller; warning'ler bilgi amaçlıdır.

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Backend hazırla ve başlat ──
      - name: Backend Install
        working-directory: backend
        run: npm ci

      - name: Backend Prisma
        working-directory: backend
        run: npx prisma generate && npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./prisma/e2e.db

      - name: Backend Seed
        working-directory: backend
        run: node seed-preview.js
        env:
          DATABASE_URL: file:./prisma/e2e.db

      - name: Start Backend
        working-directory: backend
        run: |
          DATABASE_URL=file:./prisma/e2e.db \
          JWT_SECRET=e2e-test-secret-12345678901234567890 \
          NODE_ENV=staging ENABLE_LOCAL_AUTH=true PORT=5000 \
          nohup node index.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5000/health && break; sleep 2; done
          curl -sf http://localhost:5000/health

      # ── Frontend hazırla ve başlat ──
      - name: Frontend Install
        working-directory: frontend
        run: npm ci

      - name: Frontend Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

      - name: Start Frontend
        working-directory: frontend
        run: |
          NEXT_PUBLIC_API_URL=http://localhost:5000 \
          nohup npx next start -p 3005 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3005 && break; sleep 2; done
          curl -sf http://localhost:3005

      # ── Playwright ──
      - name: Root Install (playwright)
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test
        env:
          CI: 'true'
