name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI Status
        run: echo "CI verification step - ensure tests pass before deployment"

  deploy:
    name: Deploy to Server via SSH
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Execute Deployment Script on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            echo "🚀 Deploying to ${{ inputs.environment }} environment..."
            
            # 1. Proje dizinine git
            cd /var/www/biletapp || exit 1
            
            # 2. Kodları çek
            git pull origin main
            
            # 3. Backend bağımlılıkları ve build
            echo "📦 Installing backend dependencies..."
            cd backend
            npm ci --production
            
            # 4. Veritabanı migrate (Eğer prisma varsa)
            # npx prisma migrate deploy
            
            # 5. Frontend bağımlılıkları ve build
            echo "📦 Installing frontend dependencies..."
            cd ../frontend
            npm ci
            echo "🏗️ Building frontend..."
            npm run build
            cd ..
            
            # 6. PM2 yeniden başlatma (Downtime'ı en aza indirmek için reload)
            echo "🔄 Reloading PM2 ecosystem..."
            pm2 reload ecosystem.config.js --env production --update-env
            
            echo "✅ Deployment completed successfully!"
