name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/bilet-app
            
            echo "1. Kodlar güncelleniyor..."
            git pull origin main
            
            echo "2. Backend bağımlılıkları yükleniyor..."
            cd backend
            npm ci --production
            
            echo "3. Veritabanı migrate ediliyor..."
            npx prisma migrate deploy
            
            echo "4. Frontend bağımlılıkları yükleniyor..."
            cd ../frontend
            npm ci
            
            echo "5. Frontend derleniyor..."
            npm run build
            
            echo "6. Servisler yeniden başlatılıyor..."
            cd ..
            pm2 reload ecosystem.config.js --env production
            
            echo "7. Health check doğrulanıyor..."
            curl -f http://127.0.0.1:5000/api/health
            curl -f http://127.0.0.1:3000

            echo "8. Nginx reload (gerekirse)..."
            sudo systemctl reload nginx
            
            echo "✅ Deploy tamamlandı!"
